name: Verify Ultraviolet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build and ML failover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ml-failover
      - run: npm run test:rural-ranking
      - run: npm run test:crop-expansion-policy
      - run: npm run test:crop-coverage

  cropfit:
    name: Released model inference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine-learning/requirements-inference.txt
      - name: Install the released CropFit model
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/installCropFitModel.sh
      - name: Verify offline inference and yield evidence
        run: npm run test:cropfit
      - name: Verify local HTTP fallback without Spark
        run: npm run test:cropfit:http

  cropfit-macos:
    name: Mac Apple Silicon fallback
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine-learning/requirements-inference.txt
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install and verify the released CropFit model
        env:
          GH_TOKEN: ${{ github.token }}
          CROPFIT_PYTHON: python3.12
        run: ./scripts/installCropFitModel.sh
      - name: Verify loopback HTTP fallback without Spark
        run: ./scripts/verifyCropFitHttp.sh
